
name: Supabase Database Backup

on:
  schedule:
    # Каждый день в 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup production database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set backup filename
        shell: bash
        run: |
          echo "BACKUP_DATE=$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> "$GITHUB_ENV"

      - name: Export public schema and data
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "SUPABASE_DB_URL is not configured."
            exit 1
          fi

          docker run --rm \
            -e DATABASE_URL \
            -v "$GITHUB_WORKSPACE:/backup" \
            postgres:17-alpine \
            sh -ec '
              pg_dump "$DATABASE_URL" \
                --schema=public \
                --format=custom \
                --no-owner \
                --no-acl \
                --file="/backup/database.dump"
            '

          test -s database.dump

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_ENCRYPTION_PASSWORD:-}" ]; then
            echo "BACKUP_ENCRYPTION_PASSWORD is not configured."
            exit 1
          fi

          openssl enc -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 600000 \
            -in database.dump \
            -out "bionit-${BACKUP_DATE}.dump.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD

          test -s "bionit-${BACKUP_DATE}.dump.enc"
          rm -f database.dump

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: bionit-database-${{ env.BACKUP_DATE }}
          path: bionit-${{ env.BACKUP_DATE }}.dump.enc
          if-no-files-found: error
          retention-days: 14
